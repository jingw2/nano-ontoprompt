# E0-CI: core Agent verification pipeline.
#
# Exact Python 3.11/3.12 matrix whose install/migration/API/worker smoke
# commands run through the guarded launcher/bootstrap (no pip, migration, or
# service command precedes the guard), with PostgreSQL 16 + Redis 7 services,
# frontend test:ci, the artifact evaluation run, and a Python 3.10 negative job
# that refuses unsupported Python BEFORE any install.  Every core packet
# command is owned by exactly one job step (scripts/ci/check_agent_plan_contract.py).
name: agent-mvp

on:
  push:
  pull_request:

jobs:
  python-floor-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Unsupported Python is refused before any install
        run: |
          cd backend
          set +e
          uv run --python "3.10" python scripts/guarded_entrypoint.py -- \
            python -c "print('SHOULD_NOT_RUN')" > /tmp/negative.txt 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q UNSUPPORTED_PYTHON_VERSION /tmp/negative.txt
          if grep -q SHOULD_NOT_RUN /tmp/negative.txt; then
            echo "target ran on unsupported Python" >&2
            exit 1
          fi

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Pin npm 11.2.0
        run: |
          npm install -g npm@11.2.0
          test "$(npm --version)" = "11.2.0"
      - name: Frontend test:ci
        working-directory: frontend
        run: npm ci && npm run test:ci

  m1-stabilization-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: M1 gate — fresh docker compose up against an empty database
        run: bash scripts/verify_m1_stabilization_gate.sh
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.v2.yml logs --no-color > /tmp/m1-gate-compose.log 2>&1 || true
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m1-gate-compose-logs
          path: /tmp/m1-gate-compose.log

  backend-matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ontexus_test
          POSTGRES_USER: ontexus
          POSTGRES_PASSWORD: ontexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontexus -d ontexus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Guarded dependency install
        run: cd backend && python scripts/bootstrap_backend.py
      - name: Migration through the guard
        run: |
          cd backend
          TEST_DATABASE_URL=postgresql://ontexus:ontexus@localhost:5432/ontexus_test \
            python scripts/run_migrations.py upgrade head
      - name: API smoke through the guarded launcher
        run: |
          cd backend
          TEST_DATABASE_URL=postgresql://ontexus:ontexus@localhost:5432/ontexus_test \
            REDIS_URL=redis://localhost:6379/0 \
            python scripts/guarded_entrypoint.py -- python -m uvicorn app.main:app \
              --host 127.0.0.1 --port 8000 &
          API_PID=$!
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$API_PID" 2>/dev/null || true
          test "$ok" -eq 1
      - name: Worker smoke through the guarded launcher
        run: |
          cd backend
          TEST_DATABASE_URL=postgresql://ontexus:ontexus@localhost:5432/ontexus_test \
            REDIS_URL=redis://localhost:6379/0 \
            timeout 25 python scripts/guarded_entrypoint.py -- python -m celery \
              -A app.tasks.celery_app worker --loglevel=warning --concurrency=1 || code=$?
          test "${code:-0}" -eq 124 || test "${code:-0}" -eq 0
      - name: Backend core suites
        run: |
          cd backend
          TEST_DATABASE_URL=postgresql://ontexus:ontexus@localhost:5432/ontexus_test \
            TEST_DATABASE_ADMIN_URL=postgresql://ontexus:ontexus@localhost:5432/postgres \
            python -m pytest -q
      - name: Agent evaluation corpus
        run: cd backend && python -m evals.agent_ontology.run --manifest core-v1 --adapter fake --seed 141 --output artifacts/evals/result.json
      - name: Document extraction eval (non-blocking)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        timeout-minutes: 20
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_LIVE_EVALS: "1"
        run: cd backend && python -m evals.document_extraction.run --manifest core-v1 --adapter deepseek --output artifacts/evals/document_extraction_result.json
      - name: Frontend E2E suite
        working-directory: frontend
        timeout-minutes: 15
        continue-on-error: true
        run: |
          AGENT_E2E_DB_URL=postgresql://ontexus:ontexus@localhost:5432/ontexus_test \
            AGENT_E2E_REDIS_URL=redis://localhost:6379/0 \
            bash ../scripts/run_agent_e2e.sh
      - name: Plan contract check
        run: cd backend && python scripts/ci/check_agent_plan_contract.py
