[project]
name = "ontexus-runtime-sdk"
version = "1.0.0"
description = "Python SDK: a thin transport adapter over the Ontexus Runtime REST API (Task 16)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["ontexus_runtime*"]
