model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
review_model = "gpt-5.6-sol"

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[agents.executor]
description = "Implement an approved plan with minimal, verified changes."
config_file = "./agents/executor.toml"

[agents.reviewer]
description = "Review completed implementation for correctness, regressions, security, and missing tests."
config_file = "./agents/reviewer.toml"
