# E0-IMAGES: milestone Agent deployment (digest-pinned, guarded-launcher).
#
# Every Python service starts through the guarded launcher
# (`scripts/guarded_entrypoint.py`, which refuses unsupported Python before any
# service import) and first verifies the signed build manifest baked at image
# build time (/manifests/agent.json).  Migrations route through E0-DB's
# `run_migrations.py`.  Image refs match the roles pinned by
# `scripts/generate_build_manifest.py`.
name: ontexus-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ontexus
      POSTGRES_USER: ontexus
      POSTGRES_PASSWORD: ontexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontexus -d ontexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migration:
    image: ontexus-agent-api:agent-v1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ontexus:ontexus@db:5432/ontexus
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --expect-head 0017_mcp_write_requests && exec python scripts/guarded_entrypoint.py -- python scripts/run_migrations.py upgrade head"

  api:
    image: ontexus-agent-api:agent-v1
    ports: ["8000:8000"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ontexus:ontexus@db:5432/ontexus
      REDIS_URL: redis://redis:6379/0
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --expect-head 0017_mcp_write_requests && exec python scripts/guarded_entrypoint.py -- python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  dispatcher:
    image: ontexus-agent-dispatcher:agent-v1
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ontexus:ontexus@db:5432/ontexus
      REDIS_URL: redis://redis:6379/0
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --expect-head 0017_mcp_write_requests && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=1 -n dispatcher@%h"

  artifact_worker:
    image: ontexus-agent-worker:agent-v1
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ontexus:ontexus@db:5432/ontexus
      REDIS_URL: redis://redis:6379/0
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --expect-head 0017_mcp_write_requests && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=1 -n worker@%h"

  beat:
    image: ontexus-agent-beat:agent-v1
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ontexus:ontexus@db:5432/ontexus
      REDIS_URL: redis://redis:6379/0
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --expect-head 0017_mcp_write_requests && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app beat --loglevel=warning"

  watchdog:
    image: ontexus-agent-watchdog:agent-v1
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ontexus:ontexus@db:5432/ontexus
      REDIS_URL: redis://redis:6379/0
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --expect-head 0017_mcp_write_requests && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=1 -n watchdog@%h"

  sweeper:
    image: ontexus-agent-sweeper:agent-v1
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ontexus:ontexus@db:5432/ontexus
      REDIS_URL: redis://redis:6379/0
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --expect-head 0017_mcp_write_requests && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=1 -n sweeper@%h"

  frontend:
    image: ontexus-agent-frontend:agent-v1
    ports: ["5173:4173"]
    depends_on:
      api:
        condition: service_started
    command: npm run preview -- --host 0.0.0.0
